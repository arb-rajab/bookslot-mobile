name: Android native (skip)

# Required-status-check workaround for a gap in GitHub's own model: once
# `flutter_stripe pinned` (android-native.yml's job) is a required status
# check on `main`, any PR whose files don't match that workflow's `paths`
# trigger (a docs-only PR, for example) blocks forever, because the real
# check never runs to report a result. See docs/project-memory/04-decisions.md
# D-15/D-16, and GitHub's own documented pattern for this exact problem:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-including-paths
#
# This job is named to exactly match android-native.yml's PR check name
# ("flutter_stripe pinned") and fires only when none of that workflow's
# own trigger paths changed, reporting an immediate pass so the required
# check is satisfied. On a PR that touches a mix of Android and
# non-Android paths, both this workflow and the real one run — a known,
# accepted limitation of this pattern (see GitHub's docs above): the real
# job still reports its own result under the same check name, so a real
# regression still shows as a failing check; this one never overrides a
# later failure, only fills the gap when the real job wouldn't run at all.

on:
  pull_request:
    paths-ignore:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'integration_test/**'
      - 'lib/main.dart'
      - 'lib/services/reminder_scheduler.dart'
      - '.github/workflows/android-native.yml'
      - '.github/scripts/**'

concurrency:
  group: android-native-skip-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  native:
    name: flutter_stripe pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: echo "No Android-native-affecting files changed; skipping the real build/emulator job."
