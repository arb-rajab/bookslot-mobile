name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test integration_test

      - run: flutter analyze

      - run: flutter test --coverage

      # integration_test/ needs a booted emulator, so it runs in
      # android-native.yml instead (see
      # docs/project-memory/03-testing-strategy.md).
