name: Reminder lateness probe

# One-off measurement for backlog #11 (docs/project-memory/05-backlog.md):
# how late does an inexact Android reminder actually arrive, at a scale
# closer to the real product's "2 hours before, booked days ahead" than the
# ~4 minute case D-11 happened to measure? Not a per-PR gate — dispatch it
# by hand when the measurement is needed. See
# .github/scripts/reminder-lateness-check.sh for the two trial modes
# ("real": a moderate scale, waited out in real elapsed time; "jump": a
# multi-day scale, reached by jumping the emulator's clock forward, which is
# NOT equivalent to a real multi-day wait — see that script's header).

on:
  # Runs once, automatically, on the PR that introduces this workflow (a
  # freshly-added workflow_dispatch-only workflow can't be dispatched via
  # the API until it exists on the default branch — this is how its first
  # run gets its real data before that merge). Removed again once that PR
  # has its measurement; see docs/project-memory/05-backlog.md #11.
  pull_request:
    paths:
      - '.github/workflows/reminder-lateness-probe.yml'
      - '.github/scripts/reminder-lateness-check.sh'
      - 'integration_test/lateness_probe_main.dart'
  workflow_dispatch:
    inputs:
      real_due_in_minutes:
        description: 'Real-time trial: minutes from "now" until the reminder is due'
        default: '15'
      jump_due_in_minutes:
        description: 'Clock-jump trial: minutes from "now" until the reminder is due (e.g. 4200 = 70h, a booking ~3 days out minus the 2h lead)'
        default: '4200'
      jump_leeway_seconds:
        description: 'Clock-jump trial: how close to the due time to jump to, then wait out in real time'
        default: '600'
      real_trials:
        description: 'How many times to repeat the real-time trial'
        default: '2'
      jump_trials:
        description: 'How many times to repeat the clock-jump trial'
        default: '1'

concurrency:
  group: reminder-lateness-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Reminder lateness probe
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # inputs.* is only populated for workflow_dispatch; the pull_request
    # trigger (see above) falls back to the same defaults.
    env:
      REAL_DUE_IN_MINUTES: ${{ inputs.real_due_in_minutes || '15' }}
      JUMP_DUE_IN_MINUTES: ${{ inputs.jump_due_in_minutes || '4200' }}
      JUMP_LEEWAY_SECONDS: ${{ inputs.jump_leeway_seconds || '600' }}
      REAL_TRIALS: ${{ inputs.real_trials || '2' }}
      JUMP_TRIALS: ${{ inputs.jump_trials || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build real-time-trial probe APK
        run: |
          flutter build apk --debug -t integration_test/lateness_probe_main.dart \
            --dart-define=DUE_IN_MINUTES="$REAL_DUE_IN_MINUTES"
          cp build/app/outputs/flutter-apk/app-debug.apk build/lateness-probe-real.apk

      - name: Build clock-jump-trial probe APK
        run: |
          flutter build apk --debug -t integration_test/lateness_probe_main.dart \
            --dart-define=DUE_IN_MINUTES="$JUMP_DUE_IN_MINUTES"
          cp build/app/outputs/flutter-apk/app-debug.apk build/lateness-probe-jump.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run lateness trials on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Each line here runs as its own separate shell (see
          # run-integration-tests.sh's header), so the repeat-count loop for
          # each mode lives inside reminder-lateness-check.sh itself, not
          # here.
          script: |
            .github/scripts/reminder-lateness-check.sh build/lateness-probe-real.apk real "$REAL_TRIALS"
            .github/scripts/reminder-lateness-check.sh build/lateness-probe-jump.apk jump "$JUMP_TRIALS" "$JUMP_LEEWAY_SECONDS"
